server {
    listen 80;
    server_name ezmodel-hub.re.kr;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    charset utf-8;
    client_max_body_size 500M;

    location = /api/login {
        proxy_pass http://backend:8000/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js 내부 API (쿠키 설정용 route.ts)
    location = /api/auth/cookie {
        proxy_pass http://aas_repo_front:5000;
        proxy_http_version 1.1;
        
        # 큰 JWT 토큰 쿠키 처리를 위해 버퍼 크기 확장
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # SSL Termination 대응
    }

    location = /api/logout {
        proxy_pass http://aas_repo_front:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 일반 API (FastAPI 백엔드)
    # 위의 정확한 매칭을 제외한 모든 /api/ 요청은 백엔드로 전달됩니다.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 프론트엔드 (Next.js 서비스)
    location / {
        proxy_pass http://aas_repo_front:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Portainer 및 정적 파일 설정
    location /portainer/ {
        proxy_pass http://portainer:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /aas_files/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /sm_files/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}